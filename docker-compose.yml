# OPTIONAL: real local Postgres for those who prefer it over the default PGlite.
# Usage: docker compose up -d, then set in .env:
#   GRIDFIN_DB=remote
#   DATABASE_URL=postgres://gridfin:gridfin@localhost:5432/gridfin
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gridfin
      POSTGRES_PASSWORD: gridfin
      POSTGRES_DB: gridfin
    ports:
      - "5432:5432"
    volumes:
      - gridfin-pgdata:/var/lib/postgresql/data
volumes:
  gridfin-pgdata:
